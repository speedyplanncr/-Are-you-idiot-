<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Question</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 35px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            transform: translateY(0);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 
                        0 0 30px rgba(99, 102, 241, 0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.4s ease;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            position: relative;
            min-height: 70px;
        }

        button {
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
        }

        #yesBtn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            z-index: 2;
        }

        #yesBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.7);
        }

        #yesBtn:active {
            transform: scale(0.95);
        }

        #noBtn {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.5);
            position: relative;
            z-index: 1;
        }

        .success-box {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-text {
            font-size: 2.3rem;
            background: linear-gradient(135deg, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
            margin-bottom: 10px;
        }

        .sub-text {
            font-size: 1rem;
            color: #94a3b8;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.4s forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <h1 id="question">Are you an idiot?</h1>
        <div class="btn-container" id="container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="shrinkNo()" ontouchstart="shrinkNo()">No</button>
        </div>
    </div>

    <script>
        let scaleVal = 1;
        let clickCount = 0;

        function shrinkNo() {
            scaleVal -= 0.25;
            clickCount++;
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            if (scaleVal > 0) {
                noBtn.style.transform = `scale(${scaleVal}) rotate(${clickCount * 15}deg)`;
                noBtn.style.opacity = scaleVal;
                // თანდათან "Yes" ღილაკიც იზრდება, რომ სრული ყურადღება მიიქციოს
                yesBtn.style.transform = `scale(${1 + (clickCount * 0.1)} )`;
            } else {
                noBtn.style.display = 'none';
                yesBtn.style.transform = 'scale(1.2)';
            }
        }

        function sayYes() {
            const card = document.getElementById('card');
            card.innerHTML = `
                <div class="success-box">
                    <div class="success-text">Hahah, I Knew It! 😂</div>
                    <div class="sub-text">good job</div>
                </div>
            `;
        }
    </script>

</body>
</html>
